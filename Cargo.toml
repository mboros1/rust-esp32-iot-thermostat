[package]
name = "rust-esp32-iot-thermostat"
version = "0.1.0"
authors = ["Martin Boros <mboros04@gmail.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.77"
[[bin]]
name = "rust-esp32-iot-thermostat"
harness = false # do not use the built in cargo test harness -> resolve rust-analyzer errors
[profile.release]
opt-level = "s"
[profile.dev]
debug = true    # Symbols are nice and they don't increase the size on Flash
opt-level = "z"
[features]
default = []
experimental = ["esp-idf-svc/experimental"]
[dependencies]
log = "0.4"
esp-idf-svc = { version = "0.50", features = ["critical-section", "embassy-time-driver", "embassy-sync"] }
embedded-hal = "0.2.7"
esp-idf-hal = "0.45.2"
esp-idf-sys = "0.36.1"
esp32-nimble = "0.9.0"
anyhow = "1.0.95"
[build-dependencies]
embuild = "0.33"


[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "onewire_bus", version = "^1.0.2" }
# [patch.crates-io]
